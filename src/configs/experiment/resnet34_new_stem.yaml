# @package _global_
# TSM + ResNet34 (deeper stem)  —  Track A
# python src/train.py experiment=resnet34_new_stem
defaults:
  - override /model: tsm_backbone

model:
  pretrained: false
  fold_div: 8
  in_channels: 6
  change_stem: true

training:
  augmentation: true
  mixup_alpha: 0.3
  epochs: 40
  batch_size: 128 # Should be just the limit
  num_workers: 4
  lr: 1e-3
  optimizer: adamw
  weight_decay: 1e-1
  scheduler: warmup_cosine
  warmup_epochs: 4
  label_smoothing: 0.2
  checkpoint_path: ${hydra:runtime.cwd}/best_model_backbone.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/latest_model_backbone.pt
  # resume_from: ${hydra:runtime.cwd}/latest_model_backbone.pt

dataset:
  num_frames: 4
  use_frame_differencing: true

augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.5
  blur_prob: 0.3