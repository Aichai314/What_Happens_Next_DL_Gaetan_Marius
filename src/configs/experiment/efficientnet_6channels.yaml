# @package _global_
# EfficientNet + TSM —  Track A
# python src/train.py experiment=efficientnet_6channels
defaults:
  - override /model: efficientnet_baseline

model:
  pretrained: false
  fold_div: 8
  in_channels: 6
  new_tsm: true
  dropout: 0.4
  stochastic_depth: 0.3

training:
  augmentation: true
  mixup_alpha: 0.4
  epochs: 50
  batch_size: 64
  num_workers: 12
  lr: 1e-3
  optimizer: adamw
  weight_decay: 1e-1
  scheduler: warmup_cosine
  warmup_epochs: 5
  label_smoothing: 0.2
  checkpoint_path: ${hydra:runtime.cwd}/best_model_efficientnetb0.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/latest_model_efficientnetb0.pt
  # resume_from: ${hydra:runtime.cwd}/latest_model_efficientnetb0.pt

dataset:
  num_frames: 4
  use_frame_differencing: true

augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.15
  blur_prob: 0.2
  erasing_prob: 0.3
  rotation_prob: 0.4
  rotation_degrees: 10.0

  remove_background: true
  remove_rgb_prob: 0.2
  heavy_spatial_blur: 0.2