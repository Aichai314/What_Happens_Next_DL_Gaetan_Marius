# @package _global_
# VideoMAE Large fine-tuned on Kinetics-400, adapted for 33 classes.
# python src/train.py experiment=videomae_large_kinetics
defaults:
  - override /model: videomae_large_kinetics

training:
  checkpoint_path: ${hydra:runtime.cwd}/Model_checkpoints/best_model_videomae_large_kinetics.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/Model_checkpoints/latest_model_videomae_large_kinetics.pt
  epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 4
  lr: 0.0001
  backbone_lr_factor: 0.05
  optimizer: adamw
  weight_decay: 0.1
  scheduler: cosine
  label_smoothing: 0.15
  augmentation: true
  num_workers: 4
  mixup_alpha: 0.2

dataset:
  num_frames: 8

augmentation:
  temporal_drop_prob: 0.3
  grayscale_prob: 0.4
  blur_prob: 0.4
