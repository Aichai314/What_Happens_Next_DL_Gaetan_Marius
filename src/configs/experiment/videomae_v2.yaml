# @package _global_
# VideoMAE base fine-tuned on SSv2, adapted for 33 classes.
# python src/train.py experiment=videomae_v2
defaults:
  - override /model: videomae_v2

training:
  checkpoint_path: ${hydra:runtime.cwd}/Model_checkpoints/best_model_videomae_v2_ssv2.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/Model_checkpoints/latest_model_videomae_v2_ssv2.pt
  epochs: 5
  batch_size: 8
  lr: 0.00005
  backbone_lr_factor: 0.005
  optimizer: adamw
  weight_decay: 0.2
  scheduler: cosine
  label_smoothing: 0.2
  augmentation: true
  num_workers: 4
  mixup_alpha: 0.4

dataset:
  num_frames: 16

augmentation:
  temporal_drop_prob: 0.5
  grayscale_prob: 0.6
  blur_prob: 0.5
