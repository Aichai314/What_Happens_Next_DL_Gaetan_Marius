# @package _global_
# ConvNeXt-Tiny + TSM + Temporal Transformer (pretrained backbone)
# python src/train.py experiment=convnext_tsm
defaults:
  - override /model: convnext_tsm

training:
  epochs: 30
  batch_size: 16
  lr: 0.0003
  backbone_lr_factor: 0.1
  scheduler: cosine
  label_smoothing: 0.1
  augmentation: true
  num_workers: 4

dataset:
  num_frames: 8
