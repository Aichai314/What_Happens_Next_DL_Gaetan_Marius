# @package _global_
# ResNet34 backbone + Attention head  —  Track A
# python src/train.py experiment=attention_stage1
model:
  name: efficientnet_attention
  num_classes: 33
  pretrained: false
  fold_div: 8
  in_channels: 3
  dropout: 0.3
  attention_dropout: 0.2
  pursue_from: ${hydra:runtime.cwd}/attn_stage1_best.pt
  freeze_backbone: false

training:
  augmentation: true
  mixup_alpha: 0.4
  epochs: 15                # Only need 15 epochs to warm up the head
  batch_size: 64
  lr: 1e-5                  # High LR to train the blank head quickly
  optimizer: adamw
  weight_decay: 1e-1        # Lighter weight decay for just the head
  scheduler: warmup_cosine
  warmup_epochs: 2
  label_smoothing: 0.2
  checkpoint_path: ${hydra:runtime.cwd}/attn_stage1_best.pt

augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.5
  blur_prob: 0.3

dataset:
  num_frames: 4