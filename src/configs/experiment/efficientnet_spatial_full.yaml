# @package _global_
# EfficientNet + TSM —  Track A
# python src/train.py experiment=efficientnet_spatial
defaults:
  - override /model: efficientnet_baseline

model:
  pretrained: false
  fold_div: 8
  in_channels: 3
  new_tsm: true
  tsm_insert_after: 0
  mlp_head: true
  dropout: 0.2

training:
  augmentation: true
  mixup_alpha: 0.3
  epochs: 50
  batch_size: 64
  num_workers: 12
  lr: 1e-3
  optimizer: adamw
  weight_decay: 1e-1
  scheduler: warmup_cosine
  warmup_epochs: 5
  label_smoothing: 0.2
  checkpoint_path: ${hydra:runtime.cwd}/best_model_efficientnetb0.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/latest_model_efficientnetb0.pt
  # resume_from: ${hydra:runtime.cwd}/best_model_efficientnet_spatial.pt

dataset:
  num_frames: 4

augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.3
  blur_prob: 0.2
  erasing_prob: 0.3
  rotation_prob: 0.4
  rotation_degrees: 10.0