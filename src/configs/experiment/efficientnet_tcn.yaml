# @package _global_
# EfficientNet + TSM —  Track A
# python src/train.py experiment=efficientnet_spatial
defaults:
  - override /model: efficientnet_baseline

model:
  pretrained: false
  fold_div: 8
  in_channels: 3
  dropout: 0.2
  new_tsm: true
  efficientnet_b1: true
  use_tcn: true
  tcn_insert_after: 5
  tcn_kernel_size: 3
  tcn_num_layers: 2

training:
  augmentation: true
  mixup_alpha: 0.4
  epochs: 50
  batch_size: 64
  num_workers: 12
  lr: 8e-4
  optimizer: adamw
  weight_decay: 1e-1
  scheduler: warmup_cosine
  warmup_epochs: 6
  label_smoothing: 0.2
  checkpoint_path: ${hydra:runtime.cwd}/best_model_efficientnet_tcn.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/latest_model_efficientnet_tcn.pt
  # resume_from: ${hydra:runtime.cwd}/best_model_efficientnet_tcn.pt

dataset:
  num_frames: 4

augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.3
  blur_prob: 0.15
  erasing_prob: 0.3
  rotation_prob: 0.5
  rotation_degrees: 10.0