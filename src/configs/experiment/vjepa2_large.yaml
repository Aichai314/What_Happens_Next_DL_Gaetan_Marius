# @package _global_
# V-JEPA 2 ViT-Large, already fine-tuned on SSv2 by Meta.
# We swap the 174-class head for our 33-class head and gently re-tune.
# Designed as a maximally complementary expert to VideoMAE for the XGBoost ensemble.
#
# python src/train.py experiment=vjepa2_large
defaults:
  - override /model: vjepa2_large

training:
  checkpoint_path: ${hydra:runtime.cwd}/Model_checkpoints/best_model_vjepa2_large.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/Model_checkpoints/latest_model_vjepa2_large.pt
  # Aggressive unfreeze (bb 0.1, 12 ep) was tried and FAILED: train hit 87%,
  # val stayed flat at ~70.5% with a 17pt gap = OVERFIT on a small set of
  # FIXED frames (deterministic linspace sampling), NOT a "reversible classes"
  # ceiling. Confusion-matrix analysis disproves the arrow-of-time theory:
  # V-JEPA captures motion direction well (Folding 86%, Pulling L->R 92%,
  # Turning upside down 88%, Moving up/down ~75%). The real bottleneck is
  # real-vs-pretended pairs (Picking up 12% vs Pretending 45%; Putting into
  # 61% vs Pretending 25%) - semantically harder: must see whether the object
  # truly leaves the surface. Levers: stochastic per-epoch frame sampling
  # (kills the fixed-frame overfit), full first-60% window coverage, and an
  # object-motion signal (flow / RGB-diff) to separate real from pretend.
  epochs: 4                       # val loss bottoms at epoch ~2; rest is overfit
  batch_size: 2
  gradient_accumulation_steps: 8  # effective batch = 16
  lr: 0.0001
  backbone_lr_factor: 0.03        # 0.1 → 0.03 : gentle adapt, minimal overfit
  optimizer: adamw
  weight_decay: 0.05
  scheduler: warmup_cosine        # warmup protects pretrained pooler from the
  warmup_epochs: 1                # random head's large initial gradients
  label_smoothing: 0.1
  augmentation: true
  num_workers: 4
  mixup_alpha: 0.0                # model underfits (train≈val) → mixup = noise

dataset:
  num_frames: 4                   # matches real data (4 jpg/video); was overridden
  image_size: 256                 # to 4 on CLI anyway despite the old 16 here

augmentation:
  temporal_drop_prob: 0.0         # only 4 frames: dropping one = info loss, not regul
  grayscale_prob: 0.2
  blur_prob: 0.2
