# @package _global_
# EfficientFormer + TSM + Attention head —  Track A
# python src/train.py experiment=efficientformer_tsm_attn

model:
  name: efficientformer_tsm
  num_classes: 33
  pretrained: false
  backbone: efficientformer_l1  # Or efficientformer_l3 for more capacity
  fold_div: 8
  in_channels: 3
  use_tsm: true
  dropout: 0.3
  stochastic_depth: 0.2
  head_type: attention # Highly recommended if training from scratch

training:
  augmentation: true
  mixup_alpha: 0.35
  epochs: 90
  batch_size: 32
  num_workers: 12
  lr: 5e-4
  optimizer: adamw
  weight_decay: 1e-1
  scheduler: warmup_cosine
  warmup_epochs: 10
  label_smoothing: 0.2
  assymetric_smoothing: false
  gradient_clip: 1.0
  use_ema: true
  checkpoint_path: ${hydra:runtime.cwd}/best_model_efficientformer_tsm.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/latest_model_efficientformer_tsm.pt
  resume_from: ${hydra:runtime.cwd}/latest_model_efficientformer_tsm.pt

dataset:
  num_frames: 4

augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.4
  blur_prob: 0.2
  erasing_prob: 0.4
  rotation_prob: 0.4
  rotation_degrees: 10.0