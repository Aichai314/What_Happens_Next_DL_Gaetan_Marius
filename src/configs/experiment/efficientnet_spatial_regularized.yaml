# @package _global_
# EfficientNet + TSM —  Track A
# python src/train.py experiment=efficientnet_spatial
defaults:
  - override /model: efficientnet_baseline

model:
  pretrained: false
  fold_div: 8
  in_channels: 3
  dropout: 0.2
  new_tsm: true
  efficientnet_b3: true
  # use_tcn: true
  # tcn_insert_after: 5
  # tcn_kernel_size: 3
  # tcn_num_layers: 2

training:
  augmentation: true
  mixup_alpha: 0.4
  epochs: 40
  batch_size: 32
  num_workers: 12
  lr: 1e-3
  optimizer: adamw
  weight_decay: 1e-1
  scheduler: warmup_cosine
  warmup_epochs: 5
  label_smoothing: 0.2
  checkpoint_path: ${hydra:runtime.cwd}/best_model_efficientnet_spatial.pt
  latest_checkpoint_path: ${hydra:runtime.cwd}/latest_model_efficientnet_spatial.pt
  # resume_from: ${hydra:runtime.cwd}/best_model_efficientnet_save_spatial.pt

dataset:
  num_frames: 4

augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.3
  blur_prob: 0.5
  erasing_prob: 0.3
  rotation_prob: 0.3
  rotation_degrees: 10.0