model:
  name: cnn_baseline
  pretrained: true
  num_classes: ${num_classes}
dataset:
  train_dir: ${hydra:runtime.cwd}/processed_data/val2/train
  val_dir: ${hydra:runtime.cwd}/processed_data/val2/val
  test_dir: ${hydra:runtime.cwd}/processed_data/val2/test
  submission_output: ${hydra:runtime.cwd}/processed_data/val2/submission.csv
  num_frames: 8
  image_size: 224
  val_ratio: 0.2
  seed: 42
  max_samples: null
augmentation:
  temporal_drop_prob: 0.1
  grayscale_prob: 0.2
  blur_prob: 0.2
  random_temporal_sampling: false
training:
  batch_size: 8
  lr: 0.0001
  epochs: 5
  num_workers: 2
  checkpoint_path: ${hydra:runtime.cwd}/best_model.pt
  device: cuda
num_classes: 33
